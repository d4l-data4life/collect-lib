name: Test

on:
  - push
  - workflow_dispatch

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gesundheitscloud/github-actions/build-setup@main
        with:
          setup-yarn: true

      - name: Test
        run: yarn run test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            junit.xml
