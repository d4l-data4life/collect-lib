name: Test

on:
  - push
  - workflow_dispatch

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: d4l-data4life/github-actions/build-setup@fix/HUB-6610/github-actions-node24
        with:
          setup-yarn: true

      - name: Test
        run: yarn run test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            junit.xml
